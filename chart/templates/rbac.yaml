{{- if .Values.rbac.create }}
{{- $fullname := include "argocd-extension-backend-api.fullname" . }}
{{- $saName := include "argocd-extension-backend-api.serviceAccountName" . }}
{{- $labels := include "argocd-extension-backend-api.labels" . }}
{{- /* Workload/ExternalSecret reads happen in the DESTINATION namespace, so the
       namespaced Roles below are created there. Follow allowedDestNamespaces when
       set, otherwise allowedNamespaces (the single-list default). */ -}}
{{- $rbacNamespaces := .Values.allowedDestNamespaces | default .Values.allowedNamespaces }}
---
# -----------------------------------------------------------------------------
# argoproj.io Applications: get + list, granted CLUSTER-WIDE (always).
#
# src/server.js's getArgoApplication() first tries a namespaced get() against
# the request's namespace and each ARGOCD_APP_NAMESPACES entry, then falls
# back to a cluster-wide listClusterCustomObject() when those all miss. That
# fallback only succeeds with a ClusterRole, so Applications get/list is
# granted cluster-wide here regardless of .Values.allowedNamespaces (a
# namespace-scoped Role cannot authorize a cluster-wide list). Argo CD
# Applications describe *what* is deployed (source/destination), not secret
# material, so this is treated as acceptable read access even in
# multi-tenant clusters.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-applications
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-applications
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-applications
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- if eq ($rbacNamespaces | toString) "*" }}
---
# -----------------------------------------------------------------------------
# CLUSTER-WIDE RBAC NOTE
#
# .Values.allowedNamespaces is "*", so the workload-discovery permissions
# below are granted CLUSTER-WIDE via a ClusterRole instead of a per-namespace
# Role. src/server.js does NOT read Secret or Pod objects (no core "" RBAC is
# requested at all); it only lists Deployments/StatefulSets/DaemonSets and
# ExternalSecrets to resolve workload names and Vault secret paths. Even so,
# prefer setting `allowedNamespaces` to a bounded comma-separated list (e.g.
# "argocd" or "team-a,team-b") so this chart creates a scoped Role +
# RoleBinding per namespace instead (see the else-branch below), keeping this
# ServiceAccount's read access confined to only the namespaces it serves.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-workloads
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-workloads
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-workloads
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $ns := ($rbacNamespaces | toString | splitList ",") }}
{{- $ns := trim $ns }}
{{- if $ns }}
---
# -----------------------------------------------------------------------------
# Least-privilege mode: allowedNamespaces is a bounded list, so a namespaced
# Role + RoleBinding (granting the same verbs the "*" branch would grant
# cluster-wide) is created here in namespace "{{ $ns }}" only. This confines
# workload/ExternalSecret discovery to just the namespace(s) this backend is
# actually configured to serve -- this is the recommended configuration;
# keep allowedNamespaces bounded whenever possible.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-workloads
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-workloads
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-workloads
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
