apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argocd-extension-backend-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-extension-backend-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "argocd-extension-backend-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argocd-extension-backend-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "argocd-extension-backend-api.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if not .Values.affinity }}
      # Default spread: no explicit topologySpreadConstraints or affinity was
      # configured, so prefer (not require) scheduling replicas onto
      # different nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "argocd-extension-backend-api.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: REQUEST_TIMEOUT_MS
              value: {{ .Values.env.requestTimeoutMs | quote }}
            - name: PROMETHEUS_BASE_URL
              value: {{ .Values.env.prometheusBaseUrl | quote }}
            - name: TEMPO_BASE_URL
              value: {{ .Values.env.tempoBaseUrl | quote }}
            - name: TEMPO_SEARCH_PATH
              value: {{ .Values.env.tempoSearchPath | quote }}
            - name: GRAFANA_BASE_URL
              value: {{ .Values.env.grafanaBaseUrl | quote }}
            - name: VAULT_BASE_URL
              value: {{ .Values.env.vaultBaseUrl | quote }}
            - name: DEPLOYMENT_CONFIG_REPO_URL
              value: {{ .Values.env.deploymentConfigRepoUrl | quote }}
            - name: CONFIG_REPO_LOCAL_ROOT
              value: {{ .Values.env.configRepoLocalRoot | quote }}
            - name: ARGOCD_APP_NAMESPACES
              value: {{ .Values.env.argocdAppNamespaces | quote }}
            # Drives both the app's own namespace gating and, indirectly,
            # the RBAC scope generated by templates/rbac.yaml -- see the
            # comment on .Values.allowedNamespaces in values.yaml.
            - name: ALLOWED_NAMESPACES
              value: {{ .Values.allowedNamespaces | quote }}
            {{- if .Values.allowedAppNamespaces }}
            # Overrides ALLOWED_NAMESPACES for the Application-CR namespace (header prefix).
            - name: ALLOWED_APP_NAMESPACES
              value: {{ .Values.allowedAppNamespaces | quote }}
            {{- end }}
            {{- if .Values.allowedDestNamespaces }}
            # Overrides ALLOWED_NAMESPACES for spec.destination.namespace (where reads happen).
            - name: ALLOWED_DEST_NAMESPACES
              value: {{ .Values.allowedDestNamespaces | quote }}
            {{- end }}
            - name: GRAFANA_LOGS_DASHBOARD
              value: {{ .Values.env.grafanaLogsDashboard | quote }}
            - name: GRAFANA_METRICS_DASHBOARD
              value: {{ .Values.env.grafanaMetricsDashboard | quote }}
            - name: GRAFANA_TRACES_DASHBOARD
              value: {{ .Values.env.grafanaTracesDashboard | quote }}
            {{- if .Values.env.clusterName }}
            - name: CLUSTER_NAME
              value: {{ .Values.env.clusterName | quote }}
            {{- end }}
            {{- if .Values.githubToken.existingSecretName }}
            # GITHUB_TOKEN is sensitive; it is only ever sourced from a
            # pre-existing Secret (never a plain value in values.yaml).
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubToken.existingSecretName }}
                  key: {{ .Values.githubToken.existingSecretKey }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem requires a writable /tmp for npm/node.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
