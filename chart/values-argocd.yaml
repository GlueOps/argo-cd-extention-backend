# Environment overrides matching manifests/argocd-backend.yaml.
# Install into the `argocd` namespace:
#   helm install argocd-extension-backend-api chart/ -n argocd -f chart/values-argocd.yaml

# Bounded to "argocd" instead of the old "*" -- see the RBAC warning in
# templates/rbac.yaml for why unbounded "*" (which forces a cluster-wide
# workload/ExternalSecret list Role) is avoided here. The app requests NO
# secrets/pods RBAC at all.
allowedNamespaces: "argocd"

env:
  prometheusBaseUrl: "http://kps-prometheus.glueops-core-kube-prometheus-stack.svc.cluster.local:9090"
  tempoBaseUrl: ""
  grafanaBaseUrl: ""
  vaultBaseUrl: ""
  deploymentConfigRepoUrl: ""
  # Keep aligned with allowedNamespaces ("argocd"): an extra app namespace here
  # is probed on every lookup but 403'd by the app-namespace gate, adding latency
  # without allowing anything.
  argocdAppNamespaces: "argocd"

networkPolicy:
  enabled: true
