apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-extension-backend-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
automountServiceAccountToken: true
---
# -----------------------------------------------------------------------------
# argoproj.io Applications: get + list, granted CLUSTER-WIDE.
#
# src/server.js's getArgoApplication() first tries a namespaced get() and
# then falls back to a cluster-wide listClusterCustomObject() when that
# misses. That fallback only works with a ClusterRole, so this is granted
# cluster-wide regardless of ALLOWED_NAMESPACES below. Applications describe
# *what* is deployed, not secret material, so this is considered acceptable
# read access even in multi-tenant clusters.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-extension-backend-api-argocd-applications
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-extension-backend-api-argocd-applications
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-extension-backend-api-argocd-applications
subjects:
  - kind: ServiceAccount
    name: argocd-extension-backend-api
    namespace: argocd
---
# -----------------------------------------------------------------------------
# Namespaced Role, scoped to the "argocd" namespace only, matching
# ALLOWED_NAMESPACES below. src/server.js does NOT read Secret or Pod
# objects -- no core "" RBAC is requested at all -- it only lists
# Deployments/StatefulSets/DaemonSets and ExternalSecrets to resolve
# workload names and Vault secret paths. Previously ALLOWED_NAMESPACES was
# "*" with an implied cluster-wide RBAC need; bounding both the app-level
# namespace filter and this RBAC to "argocd" keeps this ServiceAccount's
# read access confined to just this namespace. If you truly need to serve
# every namespace's Applications from this instance, replace this
# Role/RoleBinding pair with a ClusterRole/ClusterRoleBinding granting the
# same rules cluster-wide, set ALLOWED_NAMESPACES back to "*", and treat
# that as a deliberate, documented exception.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-extension-backend-api-argocd-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-extension-backend-api-argocd-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-extension-backend-api-argocd-workloads
subjects:
  - kind: ServiceAccount
    name: argocd-extension-backend-api
    namespace: argocd
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: argocd-extension-backend-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-extension-backend-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-extension-backend-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-extension-backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-extension-backend-api
    spec:
      serviceAccountName: argocd-extension-backend-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Prefer (not require) spreading replicas across different nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-extension-backend-api
      containers:
        - name: argocd-extension-backend-api
          # Keep in step with package.json's version and chart/values.yaml: the
          # release workflow refuses to publish when the release tag and
          # package.json disagree. Bump all three together.
          image: ghcr.io/glueops/argocd-extension-backend-api:v0.1.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: PROMETHEUS_BASE_URL
              value: "http://kps-prometheus.glueops-core-kube-prometheus-stack.svc.cluster.local:9090"
            - name: TEMPO_BASE_URL
              value: ""
            - name: LOG_LEVEL
              value: "INFO"
            - name: GRAFANA_BASE_URL
              value: ""
            - name: VAULT_BASE_URL
              value: ""
            - name: DEPLOYMENT_CONFIG_REPO_URL
              value: ""
            # Bounded to "argocd" -- see the Role/RoleBinding comment above for why
            # "*" (which would force a cluster-wide workload/ExternalSecret list grant)
            # is avoided here. This app requests no secrets/pods RBAC at all.
            - name: ALLOWED_NAMESPACES
              value: "argocd"
            # Optional Grafana Drilldown datasource UIDs + platform dashboard UIDs.
            # Uncomment and set on clusters running the OTEL monitoring stack (see
            # CONFIGURATION.md). Unset => that signal keeps its classic dashboard /
            # the dashboard link is dropped.
            # - name: GRAFANA_LOKI_DS_UID
            #   value: ""
            # - name: GRAFANA_PROMETHEUS_DS_UID
            #   value: ""
            # - name: GRAFANA_TEMPO_DS_UID
            #   value: ""
            # - name: GRAFANA_APM_DASHBOARD
            #   value: ""
            # - name: GRAFANA_K8S_OVERVIEW_DASHBOARD
            #   value: ""
            # - name: GRAFANA_K8S_POD_DASHBOARD
            #   value: ""
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem requires a writable /tmp for npm/node.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-extension-backend-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-extension-backend-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-extension-backend-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-extension-backend-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-extension-backend-api
  policyTypes:
    - Ingress
  ingress:
    # Only the Argo CD server may reach this backend. argocd-server performs the
    # `extensions, invoke` RBAC check before proxying, so this (plus the
    # Argocd-Application-Name header check in the app) makes the proxy reachable
    # only through the authenticated extension path -- not by arbitrary pods.
    #
    # PRE-APPLY CHECKS (cluster-specific):
    #   1. Confirm the argocd-server pod label below matches your install.
    #   2. If your CNI enforces NetworkPolicy on kubelet health probes, add an
    #      ipBlock rule for the node CIDR(s) so readiness/liveness probes on
    #      port 8000 are not blocked. Many CNIs (e.g. Cilium) exempt these.
    - from:
        # Restrict to argocd-server pods *in the argocd namespace*. A bare
        # `namespaceSelector: {}` would admit any pod carrying the argocd-server
        # label in ANY namespace (trivially spoofable), defeating the policy.
        # The backend runs in argocd here, so this is the in-namespace source.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
      ports:
        - protocol: TCP
          port: 8000
