name: Build and Release Backend

on:
  release:
    # `published`, NOT `created`: GitHub does not fire `created` for a release that
    # was saved as a draft first, so the common draft-then-publish flow would publish
    # a release with no image behind it and skip the version gate below entirely.
    # `published` fires for both the direct and the draft-then-publish paths.
    types: [published]

# Least privilege: default every job to read-only; only the image-push job below
# opts into packages: write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Match the runtime image (node:24-alpine).
          node-version: '24'
          cache: 'npm'

      # Reproducible, strict install from the committed package-lock.json.
      - run: npm ci

      - run: npm test

      # The image is tagged from the release tag, but the SBOM generated at build
      # time reports package.json's version. If they disagree, the published
      # attestation contradicts the tag it is attached to -- which defeats the
      # point of shipping an SBOM. Fail the release instead of publishing that.
      - name: Release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$RELEASE_TAG" ]; then
            echo "::error::release tag '$RELEASE_TAG' does not match package.json version '$pkg_version'. Bump package.json (or retag) so the image tag, SBOM and provenance agree."
            exit 1
          fi
          echo "release tag and package.json agree: $pkg_version"

      # The chart and the raw manifests pin the image tag independently of
      # package.json, so the check above alone lets them go stale: bump package.json,
      # cut v0.2.0, and the chart happily keeps deploying the v0.1.1 image with no
      # error anywhere. README.md tells operators this workflow catches that, so
      # actually check it rather than relying on all four files being bumped by hand.
      - name: Chart and manifests pin the released image tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          image=ghcr.io/glueops/argocd-extension-backend-api
          fail=0
          chart_tag="$(node -p "require('js-yaml').load(require('fs').readFileSync('chart/values.yaml','utf8')).image.tag")"
          if [ "$chart_tag" != "$RELEASE_TAG" ]; then
            echo "::error file=chart/values.yaml::image.tag is '$chart_tag' but the release is '$RELEASE_TAG'"
            fail=1
          fi
          for m in manifests/argocd-backend.yaml manifests/venus-backend.yaml; do
            if ! grep -qF "image: $image:$RELEASE_TAG" "$m"; then
              echo "::error file=$m::does not pin $image:$RELEASE_TAG (found: $(grep -F "image: $image:" "$m" || echo none))"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "chart and manifests pin $image:$RELEASE_TAG"

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    # Only this job pushes to GHCR, so scope packages: write here rather than
    # granting it workflow-wide (the test job stays read-only).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Supply-chain attestations: SBOM + build provenance.
          sbom: true
          provenance: mode=max
          # `latest` only moves for a real release. A pre-release (v0.2.0-rc.1) that
          # claimed `latest` would silently become the default pull for every consumer
          # that omits a tag -- and image-scan.yml's own reasoning depends on `latest`
          # tracking the newest *supported* image.
          #
          # The condition is written as `!prerelease && <tag> || ''` rather than the
          # more natural `prerelease && '' || <tag>`: GitHub's && / || yield an
          # OPERAND, not a bool, and '' is falsy -- so the natural form collapses to
          # `'' || <tag>` and emits `latest` for pre-releases too, i.e. exactly the
          # bug it was meant to fix. Keep the truthy value in the left branch.
          # build-push-action drops the resulting empty line from the tag list.
          tags: |
            ghcr.io/glueops/argocd-extension-backend-api:${{ github.event.release.tag_name }}
            ${{ !github.event.release.prerelease && 'ghcr.io/glueops/argocd-extension-backend-api:latest' || '' }}

      # Image scanning lives in a separate, read-only workflow (image-scan.yml) so
      # Trivy and its transitive action deps never run in a job that holds the
      # packages:write token used to push the image.
