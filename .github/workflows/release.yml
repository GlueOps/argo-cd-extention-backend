name: Build and Release Backend

on:
  release:
    types: [created]

# Least privilege: default every job to read-only; only the image-push job below
# opts into packages: write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Match the runtime image (node:24-alpine).
          node-version: '24'
          cache: 'npm'

      # Reproducible, strict install from the committed package-lock.json.
      - run: npm ci

      - run: npm test

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    # Only this job pushes to GHCR, so scope packages: write here rather than
    # granting it workflow-wide (the test job stays read-only).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Supply-chain attestations: SBOM + build provenance.
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/glueops/argocd-extension-backend-api:${{ github.event.release.tag_name }}
            ghcr.io/glueops/argocd-extension-backend-api:latest

      # Image scanning lives in a separate, read-only workflow (image-scan.yml) so
      # Trivy and its transitive action deps never run in a job that holds the
      # packages:write token used to push the image.
