name: Validate manifests

# Schema-validates the raw manifests on every PR. This exists because a spec can
# be well-formed YAML yet rejected by the API server (e.g. a NetworkPolicy
# `namespaceSelector` missing its `matchLabels:` wrapper). `kubeconform -strict`
# catches that statically, with no cluster.
#
# Helm deployment lives in the platform chart (GlueOps/platform-helm-chart-platform),
# so there is no chart to render here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  # kubeconform validates against schemas for this k8s minor.
  KUBE_VERSION: "1.30.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate raw manifests
        run: |
          kubeconform -strict -summary -verbose \
            -kubernetes-version "${KUBE_VERSION}" \
            -ignore-missing-schemas \
            manifests/argocd-backend.yaml manifests/venus-backend.yaml
