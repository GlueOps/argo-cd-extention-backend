name: Validate deploy values and manifests

# Renders the deploy/ value overlays against the GlueOps `app` chart and
# schema-validates the output, plus the raw manifests, on every PR. This exists
# because `helm template` does NOT validate against the Kubernetes schema -- an
# invalid spec (e.g. a NetworkPolicy `namespaceSelector` missing its `matchLabels:`
# wrapper) renders cleanly but is rejected by the API server. `kubeconform -strict`
# catches that statically, with no cluster.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pin tool versions for reproducibility.
  HELM_VERSION: v3.16.2
  KUBECONFORM_VERSION: v0.8.0
  # kubeconform validates against schemas for this k8s minor.
  KUBE_VERSION: "1.30.0"
  # The GlueOps `app` template chart this backend deploys with.
  APP_CHART_REPO: https://helm.gpkg.io/project-template
  APP_CHART_VERSION: "0.13.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Add app chart repo
        run: |
          helm repo add project-template "${APP_CHART_REPO}"
          helm repo update

      # Render the app chart with each environment's overlay and schema-validate
      # the output. -strict rejects unknown/misplaced fields (the LabelSelector
      # bug); -ignore-missing-schemas skips CRDs (Application/ExternalSecret) that
      # have no published schema rather than failing on them.
      - name: Validate rendered chart
        run: |
          set -euo pipefail
          for env in argocd venus; do
            echo "== rendering app chart with deploy/values-$env.yaml =="
            ns=argocd; [ "$env" = venus ] && ns=glueops-core
            helm template argocd-extension-backend-api project-template/app \
              --version "${APP_CHART_VERSION}" -n "$ns" \
              -f ./deploy/values-common.yaml -f "./deploy/values-$env.yaml" \
              | kubeconform -strict -summary -verbose \
                  -kubernetes-version "${KUBE_VERSION}" \
                  -ignore-missing-schemas
          done

      - name: Validate raw manifests
        run: |
          kubeconform -strict -summary -verbose \
            -kubernetes-version "${KUBE_VERSION}" \
            -ignore-missing-schemas \
            manifests/argocd-backend.yaml manifests/venus-backend.yaml
